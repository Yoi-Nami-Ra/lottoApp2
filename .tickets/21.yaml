id: 21
title: "Design: chain builder outline"
type: task
description: |
  Why it's needed: LTA-20 replaces BlocksPage with a chain builder, and
  no design exists for it.
  When it shows: after choosing a source and tapping Next on the start
  page; it shows that source's processing chain.
  Built from: the current BlocksPage (source name header over a list)
  and the start page's source cards and bottom action bar.

  Decided:
  - Adding: a "+" on every row (the source included) opens the add-block
    sheet (LTA-22) for that row as parent; no separate selection state.
  - Removing: swipe to remove on block rows. A block with children is
    removed with its whole subtree after a confirmation naming how many
    blocks go.
  - Run: the bottom action bar (BottomActionBar) with a single "Run"
    button, disabled with no blocks and while a run is in flight.

  Proposal: design/proposal/21-chain-builder.html (+ .png) — eight
  frames: results, stale after an edit, running, empty, swipe to remove,
  confirm removal, dark mode, collapsed branch. It also suggests:
  - a 22 pt indent per level with a guide line to the parent (12 pt at
    accessibility text sizes, where leaf summaries wrap under the title);
  - "+" hidden on blocks that end a branch (Count All Elements);
  - tapping a block row edits its parameters, tapping a leaf with a
    result opens it;
  - a childless block is removed without a dialog; the source row can't
    be removed;
  - stale results struck through with an "Out of date" badge plus a
    banner, new leaves reading "Not run";
  - a collapsed row saying how many blocks it hides.
  Open questions: approve or change the suggestions above.
  Done when: an approved file exists in design/final/ and this ticket's
  `designs` points at it.
platform: ios
