id: 21
title: "Design: chain builder outline"
type: task
description: |
  Why it's needed: the chain editor (LTA-20, spec 003 US2–US8) has no
  approved design; LTA-23 was built against the rev. 1 proposal, which
  predates spec 003's clarifications.
  When it shows: after opening or creating a chain from the chain list
  (LTA-32).
  Built from: the rev. 1 proposal and the chain editor as built in LTA-23
  (ChainEditorView).

  Decided:
  - "+" on every row except Count All Elements opens the add-block sheet
    (LTA-22) for that row.
  - Swipe to remove; a block with children goes with its subtree after an
    alert naming how many.
  - Run lives in the bottom action bar.
  - Title area: the chain's name is the navigation title, "Source" and
    the source's name sit under it, and the back button reads "Chains".
  - Tapping a row: a block with a value opens its output, a block without
    one opens edit; Edit is always in the long-press menu (as built,
    decided 2026-09-30).
  - Saving: a leading swipe or long press offers "Save Result" on a block
    with an unsaved value; saved blocks show a bookmark.
  - Saved results are a section under the outline, newest first, with
    "Out of date", "Source unavailable" and "Chain changed since" badges
    (as built, decided 2026-09-30).
  - Leave warning (FR-032) and restore prompt (FR-031) are system alerts
    with the build's copy.

  Final: design/final/chain-builder.html (+ .png), approved 2026-09-30
  from proposal rev. 2 — fourteen frames: results, out of date, running, empty, failed block,
  save a result, long-press menu, saved results, swipe to remove, confirm
  removal, leave with unsaved results, restore prompt, dark mode,
  collapsed branch. Frames new since rev. 1 are marked NEW.

  Where the build differs from the design (fixed in LTA-33): the "+"
  accessibility label ("Add block under <block>"), row accessibility
  reading, and the accessibility-size layout (summary under the title,
  12 pt indent).

  Done when: an approved file exists in design/final/ and this ticket's
  `designs` points at it.
platform: ios
status: done
phase: MVP
