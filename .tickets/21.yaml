id: 21
title: "Design: chain builder outline"
type: task
description: |
  Why it's needed: the chain editor (LTA-20) has no approved design.
  When it shows: after opening a chain from the chain list (LTA-32).
  Built from: the current BlocksPage and the start page's cards and
  bottom action bar.

  Decided:
  - "+" on every row opens the add-block sheet (LTA-22) for that row.
  - Swipe to remove; a block with children goes with its subtree after a
    confirmation naming how many.
  - Run lives in the bottom action bar.

  Proposal: design/proposal/21-chain-builder.html (+ .png) covers
  results, stale, running, empty, swipe to remove, confirm removal, dark
  mode and a collapsed branch, plus the suggestions listed in its notes.
  It predates spec 003's clarifications and needs frames for:
  - saving the output of any block (a per-row action) and the chain's
    list of saved results, including out-of-date, "chain changed since"
    and "source unavailable" states;
  - the Save / Discard / Cancel warning when leaving with unsaved results
    (FR-032) and the "Restore unsaved results?" prompt (FR-031);
  - the title area showing the chain's name and the source it runs
    against.
  Open questions: where saved results are listed (section under the
  outline vs a separate tab); approve the earlier suggestions.
  Done when: an approved file exists in design/final/ and this ticket's
  `designs` points at it.
platform: ios
status: refine
phase: MVP
priority: medium
