id: 18
title: "Add Count Unique Combinations block"
type: feature
description: |
  A processing block that counts unique combinations in the processed
  collection, the combination-level counterpart of "Count Unique
  Elements" (LTA-9). It uses the unique-count result defined in LTA-9,
  with each unique combination as the item and its number of occurrences
  as the count: a combination drawn once counts as 1; one that shows up
  more than once counts as 2 or more.

  Behaviour:
  - Combinations are without repetition and order doesn't matter, so
    {1, 5, 9} and {9, 1, 5} are the same combination and count together.
  - The input collection holds x-of-y combinations with the same x and y
    throughout, so no CombinationType check is needed between entries.
  - Counts whole combinations only; sub-combinations are not counted.

  The block's I/O types follow the spec from LTA-8, and the combination
  rules come from LTA-6.
platform: ios
