id: 9
title: "Run Count Unique Elements and show results"
type: feature
description: |
  Deliver the Count Unique Elements block and its result screen
  (specs/003-block-pipeline US1, FR-010 row 1, FR-024–FR-026).
  Depends on the entities and the source → Game read path (LTA-6) and
  the block I/O spec (LTA-8, done).

  Scope:
  1. The block in BlockEvaluator: draws → count result of the elements
     that occur (never-drawn pool elements are not listed with 0). The
     result is unordered, stored item-ascending (FR-025).
  2. The UniqueCount / CountResult types are shared: Count Unique
     Combinations (LTA-18) and Sub-combinations (LTA-27) reuse them.
  3. ResultPage (new reducer + view): one row per element with its
     count, ordered by element ascending for display only; empty state
     ("nothing to count") rather than an error; out-of-date marking from
     the result's stamp. Leaf summary text, e.g. "49 elements".

  Running: through the chain editor — new chain → + Count Unique
  Elements → Run (LTA-19 engine, LTA-23 UI). There is no standalone run
  from the Blocks page any more; it lists saved chains (LTA-20).

  Done when (tests first): counts for repeated / single / empty inputs;
  ResultPage reducer via TestStore; light/dark #Previews for loaded,
  empty and out-of-date states.
platform: ios
status: in-review
phase: MVP
priority: high
