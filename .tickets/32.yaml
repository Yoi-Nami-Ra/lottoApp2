id: 32
title: "Design: chain list"
type: task
description: |
  Why it's needed: spec 003 turns the Blocks page into the list of saved
  chains (FR-017); there is no design for it.
  When it shows: after choosing a source and tapping Next on the start
  page.
  Built from: the current BlocksPage (source header over a list) and
  the start page's cards.
  Proposal: none yet.
  Open questions:
  - What each row shows: name, block count, last run or number of saved
    results, an out-of-date hint?
  - How "New chain", rename and delete are reached (row actions, swipe,
    edit mode), and the delete warning naming how many saved results go.
  - Empty state for a source with no chains yet.
  - Whether the source header stays as today (source name only).
  Done when: an approved file exists in design/final/ and this ticket's
  `designs` points at it.
platform: ios
status: refine
phase: MVP
priority: medium
