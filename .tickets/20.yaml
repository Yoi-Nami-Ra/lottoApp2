id: 20
title: "Build the chain-builder UI"
type: feature
description: |
  Let the user build, run, save and reuse processing chains
  (specs/003-block-pipeline, US2–US8). Parent of LTA-21, LTA-22, LTA-32
  (designs) and LTA-23 (implementation).

  Decisions (spec clarifications 2026-09-29):
  - The Blocks page becomes the list of saved chains for the chosen
    source's session: every saved chain by an editable name, plus "New
    chain"; open, rename, delete. Deleting a chain deletes its saved
    results after a warning naming how many (FR-017).
  - Opening a chain shows the chain editor: an indented outline, "+" per
    row, swipe to remove with subtree confirmation, Run in the bottom bar,
    leaf summaries, out-of-date marking (LTA-21's decisions stand).
  - Runs always use the source chosen on the start page; to switch, go
    back and choose another (FR-018).
  - The output of any block can be saved; each chain lists its saved
    results, which read as out of date after their source changes and
    show "chain changed since" after an edit (FR-027–FR-030).
  - Leaving a chain with unsaved results asks Save / Discard / Cancel
    (FR-032); unsaved results are kept as a draft when the app goes to the
    background and offered back on the next open (FR-031).
  - Results: each leaf shows a summary and opens its result screen
    (LTA-9, LTA-18).
platform: ios
status: ready
phase: MVP
priority: medium
parent: null
blocked_by: [19, 31]
