id: 23
title: "Implement chain-builder UI"
type: feature
description: |
  Build the screens designed in LTA-32, LTA-21 and LTA-22 on the engine
  from LTA-19 and the persistence from LTA-31, following LTA-20 and
  specs/003-block-pipeline/plan.md (research R10–R12,
  contracts/domain-contracts.md §5).

  Scope:
  1. BlocksPage becomes the chain list: saved chains, New chain, rename,
     delete with the saved-result-count warning.
  2. ChainEditor (new reducer + view): outline, "+" per row, swipe to
     remove, Run with progress (cancelInFlight), leaf summaries,
     out-of-date marking, save a block's output, the chain's saved
     results, a custom back button driving the FR-032 warning, a draft
     written on scenePhase .background and offered back on open.
  3. AddBlock (new reducer + view, sheet with its own StackState):
     sections, disabled blocks with reasons, parameter step, edit mode.
  4. Navigation to result screens (ResultPage from LTA-9 / LTA-18).

  Tests (written first): TestStore suites for BlocksPage, ChainEditor and
  AddBlock covering add, branch, edit, remove, run → events, stale after
  edit, new run cancels old, save result, back warning, background
  draft, restore/decline, delete cascade warning. One XCUITest happy path
  with a launch argument that swaps live dependencies for fixtures.
  Views use design tokens with light/dark #Previews for every state.

  Build from the approved files in design/final/ once LTA-32, LTA-21 and
  LTA-22 are promoted; add them to `designs` then.
platform: ios
status: in-review
phase: MVP
priority: medium
