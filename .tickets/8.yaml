id: 8
title: "Spec block I/O types and chain execution"
type: task
description: |
  Write the spec (via /speckit-specify) for the processing-block pipeline:
  the data that flows between blocks, each block's input and output, and
  how chains are represented and executed. It turns `ProcessingBlockKind`
  from a catalogue identity into runnable blocks. Prerequisite for LTA-9
  and LTA-10.

  Settled constraints:
  - Every combination is a combination without repetition where order
    doesn't matter (LTA-6).
  - A collection holds combinations of x elements from a set of y
    elements, with x and y the same for every entry, so blocks may assume
    a single CombinationType per collection.

  Decisions:
  - Data kinds: a Game (LTA-6), a count result (the set of (item, count)
    pairs from LTA-9), and a single number (count all).
  - Blocks and their input → output:
    - dropFirst(x), dropLast(x), prefix(x), suffix(x):
      Game → Game, and count result → count result
    - sort by date, sort by index: Game → Game
    - sort by count: count result → count result
    - count unique elements (LTA-9), count unique combinations (LTA-18):
      Game → count result
    - count all elements: Game → number (ends a branch)
  - Every sort takes a direction parameter (ascending / descending). A
    sorted count result is an ordered list; unsorted it is a set with no
    order of its own.
  - Chains are trees: the source is the root, and one block's output can
    feed several blocks (e.g. count over the last 50 and over the last
    100 draws side by side). Each block has exactly one input. The user
    builds chains at runtime, so each block declares its input and output
    kind and the app rejects attaching a block whose input doesn't match
    its parent's output. Every leaf yields one result.
  - Execution (settled in LTA-19): trees run on demand and an edit marks
    results stale; within a run each node is evaluated once and shared by
    its children, with no caching between runs; a new run cancels one in
    flight. Chains are kept for the session only.
  - Presentation (settled in LTA-20): each leaf shows a summary in the
    chain outline and opens its own result screen.

  Open for the spec:
  - Tie order when sorting by count (e.g. by item, ascending).
  - Parameter bounds, e.g. prefix(x) with x larger than the collection.
platform: ios
status: ready
phase: MVP
priority: high
