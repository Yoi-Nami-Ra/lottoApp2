id: 19
title: "Build the processing-block tree engine"
type: feature
description: |
  Implement the chain model and runner of specs/003-block-pipeline
  (plan: research R3–R6, contracts/domain-contracts.md §1–2).

  Scope:
  1. Pipeline Domain types: ValueKind, BlockValue, CountItem,
     UniqueCount, CountResult, SortDirection, the Block enum with its
     accepts/output table (FR-003, FR-004, FR-010), ProcessingBlockKind
     extended with every catalogue case and a defaultBlock.
  2. Chain as a flat list of parent-pointer nodes rooted at an implicit
     input that always outputs draws; not tied to any source (FR-013).
     A revision counter increments on every edit.
  3. Pure rules (ChainRules): attaching (refuses input mismatches with a
     reason, leaving the chain unchanged — FR-015), updating parameters,
     removingSubtree, outputKind, path, leaves (FR-012, FR-014, FR-016).
  4. BlockEvaluator entry point and the ChainRunner dependency: runs a
     chain against one source's Game, parents first, each node once
     (FR-019), streaming a RunEvent per node for progress (FR-018),
     isolating failures per node (FR-023), stopping on cancellation
     (FR-020). The blocks themselves arrive in LTA-9, LTA-18, LTA-24,
     LTA-25, LTA-26 and LTA-27.
  5. RunStamp on every result: source, source data state, chain revision
     (FR-021). The data-state side is LTA-30.

  Out of scope: saving chains/results/drafts (LTA-31); UI (LTA-20 and
  children).

  Done when (tests first):
  - every (parent kind × block) pair accepted exactly per FR-010 (SC-002);
  - revision bumps on add / edit / remove, not otherwise;
  - a node with several children is evaluated once per run (SC-004);
  - a failing node fails its subtree only; siblings still finish;
  - a cancelled run emits nothing more.
